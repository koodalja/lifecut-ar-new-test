<!doctype html>
<html id="photo-doc-root" lang="ko">
<head id="photo-doc-head">
  <meta id="photo-charset" charset="utf-8">
  <meta id="photo-viewport" name="viewport" content="width=device-width, initial-scale=1">
  <meta id="photo-referrer" name="referrer" content="no-referrer">
  <meta id="photo-theme" name="theme-color" content="#f8f3ec">
  <title id="photo-title">인생네컷 - 사진 다운로드</title>
  <link id="photo-stylesheet" rel="stylesheet" href="style.css">
  <script id="photo-config-script" defer src="js/config.js"></script>
  <script id="photo-script" defer src="js/photo.js"></script>
</head>
<body id="photo-body">
  <main id="photo-shell" class="app-shell">
    <header id="photo-header" class="page-header">
      <p id="photo-eyebrow" class="eyebrow">인생네컷</p>
      <h1 id="photo-heading">사진 다운로드</h1>
      <p id="photo-intro" class="intro">아래 버튼을 눌러 안전하게 사진을 받아 보세요.</p>
    </header>

    <section id="photo-card" class="photo-card" aria-labelledby="photo-heading">
      <p id="photo-status" class="status-message" role="status" aria-live="polite">
        QR 링크가 열렸어요. 버튼을 눌러 사진을 확인해 주세요.
      </p>
      <p id="photo-expiry-note" class="privacy-note">
        QR 접근은 24시간 동안 가능하며, 다운로드 주소는 요청한 뒤 10분 동안 유효합니다.
      </p>
      <button id="photo-download-button" class="capture-button" type="button" disabled>
        사진 다운로드
      </button>
    </section>
  </main>
</body>
</html>
